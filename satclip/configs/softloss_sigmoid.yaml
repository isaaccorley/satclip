# lightning.pytorch==2.0.0
# Soft-loss SatCLIP, sigmoid distance->weight penalty (rho=1000 km, tau=200 km).
# Identical to baseline.yaml except the model.soft_loss_* keys.
seed_everything: 0
trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: satclip-softloss
      name: 'satclip_softloss_sigmoid'
      save_dir: '/projects/bgtj/isaaccorley/satclip_runs/softloss_sigmoid'
      group: 'softloss-vs-baseline'
      tags: ['softloss', 'sigmoid']
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        save_last: True
        filename: "{epoch}-{val_loss:.2f}"
        dirpath: '/projects/bgtj/isaaccorley/satclip_runs/softloss_sigmoid/checkpoints'
  max_epochs: 500
model:
  loss_type: soft_loss
  soft_loss_penalty: sigmoid
  soft_loss_rho_km: 20
  soft_loss_tau_km: 10
  embed_dim: 256
  image_resolution: 256
  vision_layers: 4
  vision_width: 128
  vision_patch_size: 32
  in_channels: 13
  le_type: 'sphericalharmonics'
  frequency_num: 16
  max_radius: 0.01
  min_radius: 0.00001
  legendre_polys: 32
  sh_embedding_dims: 32
  learning_rate: 0.0001
  num_hidden_layers: 2
  capacity: 256
data:
  data_dir: /projects/bgtj/isaaccorley/s2-100k-tg-zstd
  batch_size: 512
  num_workers: 8
  val_random_split_fraction: 0.1
  transform: gpu
  pin_memory: true
  spatial_batching: true
watchmodel: True
