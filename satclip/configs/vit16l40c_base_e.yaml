# lightning.pytorch==2.0.0
# SatCLIP-ViT16-L40 (published best config): frozen MoCo ViT-S/16 + L40 spherical harmonics.
# baseline: linear penalty, rho=0.001km. Spatial batching. Matched across all runs except loss.
seed_everything: 0
trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: satclip-softloss-vit16l40
      name: 'vit16l40c_base_e'
      save_dir: '/projects/bgtj/isaaccorley/satclip_runs/vit16l40c_base_e'
      group: 'vit16l40-softloss-vs-baseline'
      tags: ['vit16l40', 'linear']
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        save_last: True
        filename: "{epoch}-{val_loss:.2f}"
        dirpath: '/projects/bgtj/isaaccorley/satclip_runs/vit16l40c_base_e/checkpoints'
  max_epochs: 500
model:
  loss_type: soft_loss
  soft_loss_penalty: linear
  soft_loss_rho_km: 0.001
  soft_loss_tau_km: 100
  embed_dim: 256
  image_resolution: 224
  vision_layers: moco_vit16
  vision_width: 128
  vision_patch_size: 32
  in_channels: 13
  le_type: 'sphericalharmonics'
  pe_type: 'siren'
  frequency_num: 32
  max_radius: 0.001
  min_radius: 0.00001
  harmonics_calculation: 'analytic'
  legendre_polys: 40
  sh_embedding_dims: 40
  learning_rate: 0.0001
  weight_decay: 0.01
  num_hidden_layers: 2
  capacity: 512
data:
  data_dir: /projects/bgtj/isaaccorley/s2-100k-tg-zstd
  cached_emb_path: /projects/bgtj/isaaccorley/s2_embeddings/vit16l40_prehead.npz
  batch_size: 512
  num_workers: 4
  crop_size: 224
  transform: pretrained
  spatial_batching: true
  spatial_group_size: 2
  pin_memory: true
  val_random_split_fraction: 0.1
watchmodel: True
