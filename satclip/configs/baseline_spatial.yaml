# lightning.pytorch==2.0.0
# Baseline SatCLIP: original contrastive loss. Identical hparams to softloss.yaml
# except `model.loss_type`. Used as the control for the soft-loss convergence study.
seed_everything: 0
trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: satclip-softloss
      name: 'satclip_baseline_spatial'
      save_dir: '/projects/bgtj/isaaccorley/satclip_runs/baseline_spatial'
      group: 'softloss-vs-baseline'
      tags: ['baseline', 'satclip_loss']
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        save_last: True
        filename: "{epoch}-{val_loss:.2f}"
        dirpath: '/projects/bgtj/isaaccorley/satclip_runs/baseline_spatial/checkpoints'
  max_epochs: 500
model:
  loss_type: satclip_loss
  embed_dim: 256
  image_resolution: 256
  vision_layers: 4
  vision_width: 128
  vision_patch_size: 32
  in_channels: 13
  le_type: 'sphericalharmonics'
  frequency_num: 16
  max_radius: 0.01
  min_radius: 0.00001
  legendre_polys: 32
  sh_embedding_dims: 32
  learning_rate: 0.0001
  num_hidden_layers: 2
  capacity: 256
data:
  data_dir: /projects/bgtj/isaaccorley/s2-100k-tg-zstd
  batch_size: 512
  num_workers: 8
  val_random_split_fraction: 0.1
  transform: gpu
  pin_memory: true
  spatial_batching: true
watchmodel: True
